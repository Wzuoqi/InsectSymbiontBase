{% extends "base.html" %}
{% load static %}

{% block Part1 %}

<div id="map-outer-container" class="p-4" style="height: 80vh;">
    <div id="map-container" class="w-full h-full overflow-auto">
        <div id="loading" class="flex flex-col items-center justify-center h-full">
            <div class="spinner"></div>
            <p class="text-xl text-gray-600 mt-4">Loading map...</p>
        </div>
        <iframe id="map-frame" src="{% static 'sample_map.html' %}" width="100%" height="100%" frameborder="0" style="display: none;"></iframe>
    </div>
</div>

<!-- Legend -->
<div class="mt-0 p-4 bg-white shadow-md rounded-lg">
    <div class="flex justify-center space-x-8">
        <div class="flex items-center">
            <span class="w-4 h-4 rounded-full bg-[#004097] mr-2"></span>
            <span>Amplicon</span>
        </div>
        <div class="flex items-center">
            <span class="w-4 h-4 rounded-full bg-[#b8ce8f] mr-2"></span>
            <span>Metagenome</span>
        </div>
    </div>
</div>

<style>
    .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #f3f3f3;
        border-top: 5px solid #004097;  /* Use the same blue as Amplicon */
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>

<script>
    // 调试日志函数
    function debugLog(message, error = null) {
        const timestamp = new Date().toISOString();
        const logMessage = `[${timestamp}] ${message}`;
        console.log(logMessage);
        if (error) {
            console.error('Error details:', error);
        }
    }

    var mapFrame = document.getElementById('map-frame');
    debugLog('Initial map frame setup');

    // 添加时间戳到URL
    const timestamp = new Date().getTime();
    const mapUrl = "{% static 'sample_map.html' %}?" + timestamp;
    mapFrame.src = mapUrl;
    debugLog(`Setting map URL: ${mapUrl}`);

    let loadAttempts = 0;  // 移到全局作用域
    let checkInterval = null;  // 用于存储interval引用

    // 清理函数
    function cleanup() {
        if (checkInterval) {
            clearInterval(checkInterval);
            checkInterval = null;
        }
    }

    // 显示错误信息
    function showError(message = 'The map failed to load, possibly due to insufficient browser memory. Please refresh and try again.') {
        cleanup();
        document.getElementById('loading').innerHTML = `
            <div class="text-red-500 text-center">
                <p class="text-xl">${message}</p>
                <button onclick="window.location.reload()" class="mt-4 px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600">
                    Refresh Page
                </button>
            </div>
        `;
    }

    // 检查iframe内容
    function checkIframeContent() {
        loadAttempts++;
        debugLog(`Attempt ${loadAttempts} of 20`);

        try {
            // 首先检查iframe是否加载完成
            if (!mapFrame.contentWindow || !mapFrame.contentWindow.document) {
                if (loadAttempts >= 20) {
                    debugLog('Max retries reached - iframe not accessible');
                    showError('Unable to load the map. This might be due to insufficient browser memory. Please refresh and try again.');
                }
                return;
            }

            // 检查页面内容
            const doc = mapFrame.contentWindow.document;
            debugLog('Document structure:', doc.body.innerHTML);  // 输出页面结构以便调试

            // 尝试查找可能的图表容器
            const plotlyGraph = doc.getElementById('graph') ||
                              doc.querySelector('[data-plotly]') ||
                              doc.querySelector('.plotly-graph-div');

            if (!plotlyGraph) {
                if (loadAttempts >= 20) {
                    debugLog('Max retries reached - graph element not found');
                    showError('The map content failed to load. This might be due to insufficient browser memory. Please refresh your browser and try again.');
                }
                return;
            }

            // 找到图表元素
            debugLog('Found graph element:', plotlyGraph);
            cleanup();  // 清除interval

            // 显示地图
            document.getElementById('loading').style.display = 'none';
            mapFrame.style.display = 'block';
            adjustMapSize();

            // 确保Plotly完全加载
            setTimeout(() => {
                try {
                    if (mapFrame.contentWindow.Plotly) {
                        mapFrame.contentWindow.Plotly.Plots.resize(plotlyGraph);
                        debugLog('Plotly resize successful');
                    } else {
                        debugLog('Warning: Plotly not found in iframe');
                    }
                } catch(e) {
                    debugLog('Error during resize:', e);
                }
            }, 500);

        } catch(e) {
            debugLog('Error checking iframe content:', e);
            if (loadAttempts >= 20) {
                showError(); // 使用默认错误消息
            }
        }
    }

    // 监听iframe加载
    mapFrame.addEventListener('load', function() {
        debugLog('Iframe load event triggered');
        loadAttempts = 0;  // 重置计数器
        cleanup();  // 清除可能存在的旧interval
        checkInterval = setInterval(checkIframeContent, 300);
    });

    // 错误处理
    mapFrame.addEventListener('error', function(e) {
        debugLog('Iframe error event triggered', e);
        showError('Failed to load the map. This might be due to insufficient browser memory. Please refresh and try again.');
    });

    function adjustMapSize() {
        debugLog('Adjusting map size');
        var windowHeight = window.innerHeight;
        var windowWidth = window.innerWidth;
        var mapOuterContainer = document.getElementById('map-outer-container');
        var mapContainer = document.getElementById('map-container');
        var mapFrame = document.getElementById('map-frame');

        mapOuterContainer.style.height = (windowHeight * 0.95) + 'px';
        var containerHeight = (windowHeight * 0.95) - 32;
        var containerWidth = windowWidth - 32;
        var minWidth = Math.max(containerWidth, 1200);

        debugLog(`Setting map dimensions - width: ${minWidth}px, height: ${containerHeight}px`);

        mapFrame.style.width = minWidth + 'px';
        mapFrame.style.height = containerHeight + 'px';

        clearTimeout(window.resizeTimer);
        window.resizeTimer = setTimeout(function() {
            mapFrame.style.width = (minWidth + 1) + 'px';
            setTimeout(() => {
                mapFrame.style.width = minWidth + 'px';
                debugLog('Forced resize completed');
            }, 10);
        }, 100);
    }

    window.addEventListener('load', () => {
        debugLog('Window load event triggered');
        adjustMapSize();
    });

    window.addEventListener('resize', () => {
        debugLog('Window resize event triggered');
        adjustMapSize();
    });
</script>

{% endblock %}
